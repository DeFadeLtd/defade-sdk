name: pr-attribution

# Pull-request descriptions carry no tool attribution (owner, 2026-10-25).
# The cloud coding session's GitHub gateway appends a "Generated by ..."
# footer to every description it writes and again on every edit, so the
# session cannot remove it; this does, on GitHub's side
# (.github/scripts/strip-pr-attribution.js). A pull request that is opened,
# edited or reopened is cleaned at once; a push of this workflow or its
# script to main, or a manual run, sweeps every pull request the repository
# has.
#
# pull_request_target runs this workflow and script as they are on main,
# never a pull request's own code: it only rewrites the description.
on:
  pull_request_target:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pr-attribution.yml'
      - '.github/scripts/strip-pr-attribution.js'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-attribution-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  strip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Strip the attribution
        run: node .github/scripts/strip-pr-attribution.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
