name: release

# Publishes a GitHub Release whenever a version tag (v*) is pushed. Directory
# scanners (npm provenance checks, Glama's "stable releases" signal) look for
# Releases, not bare tags, so the tag push is turned into one automatically.
on:
  push:
    tags: ['v*']
  # Manual fallback for environments that can push branches but not tag refs:
  # gh release create makes the tag itself when it doesn't exist yet.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (created at main if missing)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && {
            echo "Release $TAG already exists"; exit 0; }
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      # Idempotent on purpose: it compares package.json against what npm
      # serves and publishes only the missing version, so a re-dispatch for
      # an existing GitHub Release still catches npm up. Skips cleanly while
      # the NPM_TOKEN repository secret is not configured.
      - name: Publish to npm when the version is missing there
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -z "$NPM_TOKEN" ] && { echo "NPM_TOKEN secret not set — skipping npm publish"; exit 0; }
          pkg=$(node -p "require('./package.json').version")
          live=$(npm view defade version 2>/dev/null || echo none)
          [ "$live" = "$pkg" ] && { echo "npm already serves defade@$pkg"; exit 0; }
          node --test test/*.test.js
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish
          echo "published defade@$pkg (npm previously served $live)"
